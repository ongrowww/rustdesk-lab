[package]
name = "ongrow-update-runtime-probe"
version = "0.0.0"
edition = "2021"

[workspace]

[dependencies]
serde = "=1.0.228"
serde_derive = "=1.0.228"
serde_json = "=1.0.118"
sha2 = "=0.10.8"
url = "=2.5.2"
sodiumoxide = "=0.2.7"
libc = "=0.2.171"
tokio = { version = "=1.44.2", features = ["full"] }
reqwest = { version = "=0.12.24", features = ["blocking", "socks", "json", "native-tls", "rustls-tls", "rustls-tls-native-roots", "gzip"], default-features = false }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.61.1", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Threading", "Win32_UI_Shell"] }
