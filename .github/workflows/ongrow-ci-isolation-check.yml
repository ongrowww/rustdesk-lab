name: OnGROW CI inventory isolation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/ongrow_ci.rs"
      - "src/lib.rs"
      - "src/ongrow_control/**"
      - "src/ongrow_operator.rs"
      - "src/rendezvous_mediator.rs"
      - "scripts/*ongrow*"
      - ".github/workflows/ongrow*.yml"

permissions:
  contents: read

jobs:
  isolation:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: "1.81"
      - name: Verify runtime isolation and product boundaries
        run: |
          python3 scripts/test_ongrow_ci_isolation.py
          python3 scripts/test_smoke_ongrow_console.py
          python3 scripts/test_ongrow_product_profile.py
          python3 scripts/test_ongrow_windows_product.py
          git diff --check
