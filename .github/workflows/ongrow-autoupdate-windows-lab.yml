name: OnGROW transactional Windows MSI Lab
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/package_ongrow_windows_msi.py'
      - 'scripts/test_ongrow_windows_msi*'
      - 'scripts/fixtures/ongrow_msi_probe.cs'
      - 'res/msi/ongrow/**'
      - '.github/workflows/ongrow-autoupdate-windows-lab.yml'
      - 'docs/ongrow-windows-autoupdate.md'
      - 'scripts/test_ongrow_native_apply.py'
      - 'scripts/fixtures/ongrow_native_apply_probe/lib.rs'
      - 'src/ongrow_update/session_gate.rs'
      - 'src/ongrow_update/session_gate/macos.rs'
      - 'src/ongrow_update/session_gate/windows.rs'
      - 'src/ongrow_update/native_apply_tests.rs'
      - 'docs/ongrow-native-apply.md'
permissions:
  contents: read
jobs:
  msi-lifecycle:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Checkout exact trusted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check source and Python gates
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $head = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $head -ne $env:EXPECTED_SHA) { throw 'Source SHA mismatch' }
          python scripts/test_ongrow_windows_msi.py
          if ($LASTEXITCODE -ne 0) { throw 'MSI Python tests failed' }
          python scripts/package_ongrow_windows_msi.py --help
          if ($LASTEXITCODE -ne 0) { throw 'MSI CLI help failed' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Diff check failed' }
      - name: Isolated native gate Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: '1.81.0'
      - name: Original native gate and guardian pipe tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(rustc --version | cut -d ' ' -f 1-2)" = "rustc 1.81.0"
          python scripts/test_ongrow_native_apply.py
      - name: Select pinned runner-only SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.408'
      - name: Require exact SDK version
        shell: pwsh
        run: |
          $sdk = @{ sdk = @{ version = '8.0.408'; rollForward = 'disable' } } | ConvertTo-Json
          $sdk | Set-Content global.json -Encoding utf8
          dotnet --version
          if ($LASTEXITCODE -ne 0) { throw 'Pinned .NET SDK is unavailable' }
      - name: Native MSI tables and isolated network-free rollback drill
        shell: pwsh
        run: |
          ./scripts/test_ongrow_windows_msi_lifecycle.ps1 -WorkDirectory "$env:RUNNER_TEMP/ongrow-msi-probe"
          if (-not $?) { throw 'Native MSI lifecycle failed' }
