name: OnGROW Pending recovery exclusive lease native probe

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.gitattributes'
      - 'src/ongrow_update/session_gate.rs'
      - 'src/ongrow_update/session_gate/macos.rs'
      - 'src/ongrow_update/session_gate/windows.rs'
      - 'src/ongrow_update/pending_recovery_tests.rs'
      - 'scripts/test_ongrow_pending_recovery.py'
      - 'scripts/fixtures/ongrow_pending_recovery_probe/lib.rs'
      - '.github/workflows/ongrow-pending-recovery-lab.yml'
      - 'docs/ongrow-pending-recovery.md'

permissions:
  contents: read

concurrency:
  group: ongrow-pending-recovery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-pending-recovery:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact trusted recovery source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact source and unchanged dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --exit-code 8be346aff0a8a423af51c85d0faa6d66f05c5b07 "$SOURCE_SHA" -- . \
            ':(exclude)scripts/package_ongrow_windows_setup.py' \
            ':(exclude)scripts/package_ongrow_windows_msi.py' \
            ':(exclude)scripts/test_ongrow_windows_msi.py' \
            ':(exclude)scripts/test_ongrow_windows_msi_lifecycle.ps1' \
            ':(exclude)scripts/fixtures/ongrow_msi_probe.cs' \
            ':(exclude)res/msi/ongrow/Package.wixproj' \
            ':(exclude)res/msi/ongrow/Package.wxs' \
            ':(exclude).github/workflows/ongrow-autoupdate-windows-lab.yml' \
            ':(exclude).github/workflows/ongrow-lab-windows-x64.yml' \
            ':(exclude).github/workflows/ongrow-support-console-windows-x64.yml' \
            ':(exclude)scripts/test_ongrow_windows_product_msi.ps1' \
            ':(exclude).github/workflows/ongrow-windows-product-msi-lab.yml' \
            ':(exclude)docs/ongrow-windows-autoupdate.md' \
            ':(exclude)flutter/macos/Runner.xcodeproj/project.pbxproj' \
            ':(exclude)flutter/macos/Runner.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved' \
            ':(exclude)flutter/macos/Runner/AppDelegate.swift' \
            ':(exclude)flutter/macos/Runner/Info.plist' \
            ':(exclude)flutter/macos/Runner/OnGrowUpdatePolicy.swift' \
            ':(exclude)flutter/macos/Runner/OnGrowUpdater.swift' \
            ':(exclude)scripts/apply_ongrow_macos_update_profile.py' \
            ':(exclude)scripts/test_ongrow_macos_update_profile.py' \
            ':(exclude)scripts/test_ongrow_macos_update_policy.swift' \
            ':(exclude)scripts/fixtures/ongrow_sparkle_probe/keys.swift' \
            ':(exclude)scripts/fixtures/ongrow_sparkle_probe/main.swift' \
            ':(exclude)scripts/test_ongrow_sparkle_probe.py' \
            ':(exclude).github/workflows/ongrow-autoupdate-macos-lab.yml' \
            ':(exclude)docs/ongrow-macos-autoupdate.md' \
            ':(exclude).github/workflows/ongrow-lab-macos-arm64.yml' \
            ':(exclude).github/workflows/ongrow-support-console-macos-arm64.yml' \
            ':(exclude)src/ongrow_update/session_gate.rs' \
            ':(exclude)src/ongrow_update/protected_store.rs' \
            ':(exclude)src/ongrow_update/protected_store/attempt.rs' \
            ':(exclude)src/ongrow_update/protected_store_tests.rs' \
            ':(exclude)scripts/test_ongrow_update_store.py' \
            ':(exclude)docs/ongrow-update-store.md' \
            ':(exclude)src/ongrow_update/native_apply_tests.rs' \
            ':(exclude)scripts/fixtures/ongrow_native_apply_probe/lib.rs' \
            ':(exclude)scripts/test_ongrow_native_apply.py' \
            ':(exclude)scripts/test_ongrow_pending_recovery.py' \
            ':(exclude).github/workflows/ongrow-pending-recovery-lab.yml' \
            ':(exclude)docs/ongrow-native-apply.md'

      - name: Isolated probe Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: '1.81.0'

      - name: Pending recovery and existing trust regressions
        shell: bash
        run: |
          set -euo pipefail
          python scripts/test_ongrow_pending_recovery.py
          python scripts/test_ongrow_update_store.py
          python scripts/test_ongrow_update_session_gate.py
          python scripts/test_ongrow_product_profile.py
          python scripts/test_ongrow_ci_isolation.py
          git diff --check
