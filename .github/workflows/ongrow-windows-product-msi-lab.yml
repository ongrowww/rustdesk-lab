name: OnGROW real Windows product MSI installation

on:
  workflow_dispatch:
    inputs:
      baseline_run:
        description: Optional successful updater-enabled Desk build run
        required: false
        type: string
      candidate_run:
        description: Optional newer Desk build published to signed Lab feed
        required: false
        type: string
  pull_request:
    paths:
      - 'scripts/test_ongrow_windows_product_msi.ps1'
      - '.github/workflows/ongrow-windows-product-msi-lab.yml'

permissions:
  contents: read
  actions: read

jobs:
  actual-desk-update:
    if: github.event_name == 'workflow_dispatch' && inputs.baseline_run != '' && inputs.candidate_run != ''
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Resolve exact successful real Desk artifacts
        id: builds
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        env:
          BASELINE_RUN: ${{ inputs.baseline_run }}
          CANDIDATE_RUN: ${{ inputs.candidate_run }}
        with:
          script: |
            for (const [label, raw] of [['baseline', process.env.BASELINE_RUN], ['candidate', process.env.CANDIDATE_RUN]]) {
              if (!/^[1-9][0-9]*$/.test(raw)) throw new Error('Invalid real build run');
              const {data: run} = await github.rest.actions.getWorkflowRun({...context.repo, run_id: Number(raw)});
              if (run.repository.full_name !== 'ongrowww/rustdesk-lab' || run.head_repository.full_name !== run.repository.full_name ||
                  run.path !== '.github/workflows/ongrow-lab-windows-x64.yml' || run.conclusion !== 'success' ||
                  run.event !== 'workflow_dispatch') throw new Error('Untrusted real Desk build');
              const name = `ongrow-support-desk-msi-${run.run_number}-windows-x64`;
              const {data: artifacts} = await github.rest.actions.listWorkflowRunArtifacts({...context.repo, run_id: Number(raw)});
              if (artifacts.artifacts.filter(a => a.name === name && !a.expired).length !== 1) throw new Error('Exact real Desk MSI unavailable');
              core.setOutput(`${label}_artifact`, name);
              core.setOutput(`${label}_sha`, run.head_sha);
            }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ steps.builds.outputs.baseline_artifact }}
          path: ${{ runner.temp }}/desk-baseline
          run-id: ${{ inputs.baseline_run }}
          github-token: ${{ github.token }}
          repository: ongrowww/rustdesk-lab
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ steps.builds.outputs.candidate_artifact }}
          path: ${{ runner.temp }}/desk-candidate
          run-id: ${{ inputs.candidate_run }}
          github-token: ${{ github.token }}
          repository: ongrowww/rustdesk-lab
      - name: Actual signed scheduled product update
        id: actual_update
        shell: pwsh
        env:
          ONGROW_CI_SMOKE_TEST: '1'
        run: |
          $tokens=$null; $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/scripts/test_ongrow_windows_desk_update.ps1",[ref]$tokens,[ref]$errors) | Out-Null
          if ($errors.Count -ne 0) { throw 'Actual product update test syntax invalid' }
          ./scripts/test_ongrow_windows_desk_update.ps1 -BaselineDirectory '${{ runner.temp }}/desk-baseline' -CandidateDirectory '${{ runner.temp }}/desk-candidate' -BaselineSha '${{ steps.builds.outputs.baseline_sha }}' -CandidateSha '${{ steps.builds.outputs.candidate_sha }}'
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        if: failure() && steps.actual_update.outcome == 'failure'
        with:
          toolchain: '1.81.0'
      - name: Compile read-only native admission diagnostic
        if: failure() && steps.actual_update.outcome == 'failure'
        shell: pwsh
        env:
          RUSTFLAGS: --cfg ongrow_windows_integration --cfg ongrow_session_gate_probe -C target-feature=+crt-static
          ONGROW_MSI_UPGRADE_CODE: ${{ vars.ONGROW_MSI_DESK_UPGRADE_CODE }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cargo test --locked --manifest-path tools/windows-update-guardian/Cargo.toml --no-run
      - name: Read-only installed guardian admission as LocalSystem
        if: failure() && steps.actual_update.outcome == 'failure'
        shell: pwsh
        run: |
          $binaries=@(Get-ChildItem tools/windows-update-guardian/target/debug/deps/ongrow_windows_update_guardian-*.exe)
          if ($binaries.Count -ne 1) { throw 'Exact diagnostic executable required' }
          $directory=Join-Path $env:RUNNER_TEMP 'ongrow-read-only-admission'
          New-Item -ItemType Directory -Path $directory | Out-Null
          $output=Join-Path $directory 'result.txt'
          $script=Join-Path $directory 'run.ps1'
          $binary=$binaries[0].FullName.Replace("'","''")
          $result=$output.Replace("'","''")
          $candidate=Get-Content -LiteralPath '${{ runner.temp }}/desk-candidate/package.json' -Raw | ConvertFrom-Json
          $sequence=[string]$candidate.sequence
          if ($sequence -notmatch '^[1-9][0-9]*$') { throw 'Exact candidate sequence required for read-only MSI check' }
          @"
          `$env:ONGROW_WINDOWS_SYSTEM_PROBE='approved-disposable-runner'
          `$env:ONGROW_WINDOWS_CANDIDATE_SEQUENCE='$sequence'
          & '$binary' --ignored --exact ongrow_update::windows_integration::system_probe::installed_guardian_admission_is_read_only --nocapture *> '$result'
          exit `$LASTEXITCODE
          "@ | Set-Content -LiteralPath $script -Encoding utf8
          $action=New-ScheduledTaskAction -Execute (Join-Path $env:WINDIR 'System32/WindowsPowerShell/v1.0/powershell.exe') -Argument ('-NoProfile -NonInteractive -File "'+$script+'"')
          $principal=New-ScheduledTaskPrincipal -UserId 'SYSTEM' -LogonType ServiceAccount -RunLevel Highest
          $task='OnGROW read-only installed guardian admission'
          Register-ScheduledTask -TaskName $task -Action $action -Principal $principal | Out-Null
          Start-ScheduledTask -TaskName $task
          $deadline=[DateTime]::UtcNow.AddMinutes(3)
          do {
            Start-Sleep -Seconds 1
            $info=Get-ScheduledTaskInfo -TaskName $task
            $state=(Get-ScheduledTask -TaskName $task).State
          } while (($state -eq 'Running' -or $info.LastTaskResult -eq 0x41301 -or $info.LastRunTime.Year -lt 2020) -and [DateTime]::UtcNow -lt $deadline)
          Write-Output ('SYSTEM_ADMISSION_TASK_EXIT='+$info.LastTaskResult)
          if (Test-Path $output) {
            foreach ($line in Get-Content -LiteralPath $output) {
              if ($line -match '^(SYSTEM_ADMISSION_(ISOLATED:(true|false)|PHASE:(ROOT|STAGE|INSTALLED_FILE|MSIEXEC|MSI_VALIDATED|INSTALLER_ABSENT))|SYSTEM_READ_ONLY_GUARDIAN_ADMISSION_PASS|ONGROW_GATE_(REJECT|REJECT_CONTEXT|OWNER|ACCESS_PRINCIPAL|ACCESS_RIGHT):[a-z-]+)$') { Write-Output $line }
            }
          }
          if ($state -eq 'Running' -or $info.LastTaskResult -ne 0) { throw 'Read-only installed guardian admission failed; fixture retained' }
          Unregister-ScheduledTask -TaskName $task -Confirm:$false
  product-install:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-2022
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - product: customer-desk
            build_run: '38396395170'
            artifact: ongrow-support-desk-msi-16-windows-x64
            build_sha: 6abdaf967a9d9e34be35782f07f82ddfd6642366
            workflow: ongrow-lab-windows-x64.yml
          - product: support-console
            build_run: '38390972539'
            artifact: ongrow-support-console-msi-45-windows-x64
            build_sha: ad23f1a7d909237e15c893642f14e7f9d236db5e
            workflow: ongrow-support-console-windows-x64.yml
    env:
      BUILD_SHA: ${{ matrix.build_sha }}
    steps:
      - name: Checkout exact installation test source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify reviewed product build provenance
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          BUILD_RUN: ${{ matrix.build_run }}
          BUILD_WORKFLOW: ${{ matrix.workflow }}
          BUILD_ARTIFACT: ${{ matrix.artifact }}
        with:
          script: |
            const runId = Number(process.env.BUILD_RUN);
            const {data: run} = await github.rest.actions.getWorkflowRun({...context.repo, run_id: runId});
            if (run.repository.full_name !== 'ongrowww/rustdesk-lab' ||
                run.head_repository.full_name !== run.repository.full_name ||
                run.head_sha !== process.env.BUILD_SHA || run.conclusion !== 'success' ||
                run.path !== `.github/workflows/${process.env.BUILD_WORKFLOW}` ||
                !['workflow_dispatch', 'pull_request'].includes(run.event)) {
              throw new Error('Untrusted product build');
            }
            const {data: artifacts} = await github.rest.actions.listWorkflowRunArtifacts({...context.repo, run_id: runId});
            const matches = artifacts.artifacts.filter(a => a.name === process.env.BUILD_ARTIFACT && !a.expired);
            if (matches.length !== 1) throw new Error('Reviewed product artifact missing');
      - name: Verify source ancestry and PowerShell parser
        shell: pwsh
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if ((& git rev-parse HEAD).Trim() -ne $env:SOURCE_SHA) { throw 'Test source SHA mismatch' }
          git merge-base --is-ancestor $env:BUILD_SHA HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Product is outside reviewed branch ancestry' }
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$pwd/scripts/test_ongrow_windows_product_msi.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -ne 0) { throw 'Product install test PowerShell syntax invalid' }
      - name: Download exact existing product MSI
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.temp }}/ongrow-product-msi
          run-id: ${{ matrix.build_run }}
          github-token: ${{ github.token }}
          repository: ongrowww/rustdesk-lab
      - name: Install and uninstall real app with blocked network
        shell: pwsh
        env:
          PRODUCT: ${{ matrix.product }}
          ONGROW_CI_SMOKE_TEST: '1'
        run: |
          ./scripts/test_ongrow_windows_product_msi.ps1 -Product $env:PRODUCT -ArtifactDirectory "$env:RUNNER_TEMP/ongrow-product-msi" -SourceSha $env:BUILD_SHA
          if (-not $?) { throw 'Real product MSI test failed' }
