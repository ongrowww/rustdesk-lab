name: OnGROW Support Desk - macOS ARM64 Lab

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ongrow-support-desk-macos-arm64-lab
  cancel-in-progress: false

env:
  VERSION: "1.4.9"
  BRIDGE_RUST_VERSION: "1.75"
  MAC_RUST_VERSION: "1.81"
  BRIDGE_FLUTTER_VERSION: "3.22.3"
  FLUTTER_VERSION: "3.24.5"
  CARGO_EXPAND_VERSION: "1.0.95"
  FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  ONGROW_RENDEZVOUS_HOST: "${{ vars.ONGROW_RENDEZVOUS_HOST }}"
  ONGROW_HBBS_PUBLIC_KEY: "${{ vars.ONGROW_HBBS_PUBLIC_KEY }}"
  ONGROW_CONTROL_PLANE_URL: "${{ vars.ONGROW_CONTROL_PLANE_URL }}"

jobs:
  generate-bridge:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          submodules: recursive
          persist-credentials: false

      - name: Validate and apply OnGROW product profile
        shell: bash
        run: |
          test -n "$ONGROW_RENDEZVOUS_HOST"
          test -n "$ONGROW_HBBS_PUBLIC_KEY"
          test -n "$ONGROW_CONTROL_PLANE_URL"
          python3 scripts/test_ongrow_product_profile.py
          git -C libs/hbb_common apply --unidiff-zero \
            "$GITHUB_WORKSPACE/.github/patches/ongrow-support-desk-hbb-common.patch"
          python3 scripts/apply_ongrow_product_profile.py \
            --role customer-desk \
            --app-name "OnGROW Support Desk" \
            --rendezvous-host "$ONGROW_RENDEZVOUS_HOST" \
            --hbbs-public-key "$ONGROW_HBBS_PUBLIC_KEY" \
            --control-plane-url "$ONGROW_CONTROL_PLANE_URL"
          test "$(git -C libs/hbb_common diff --name-only)" = "src/config.rs"

      - name: Verify source revision
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)" = "$VERSION"

      - name: Install prerequisites
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            ca-certificates \
            clang \
            cmake \
            curl \
            gcc \
            git \
            g++ \
            libclang-dev \
            libgtk-3-dev \
            llvm-dev \
            nasm \
            ninja-build \
            pkg-config \
            wget

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.BRIDGE_RUST_VERSION }}
          targets: x86_64-unknown-linux-gnu
          components: rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: bridge-ubuntu-22.04

      - name: Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.BRIDGE_FLUTTER_VERSION }}
          cache: true

      - name: Install Flutter Rust Bridge dependencies
        shell: bash
        run: |
          cargo install cargo-expand --version "$CARGO_EXPAND_VERSION" --locked
          cargo install flutter_rust_bridge_codegen \
            --version "$FLUTTER_RUST_BRIDGE_VERSION" --features "uuid" --locked
          sed -i -e 's/extended_text: 14.0.0/extended_text: 13.0.0/g' \
            flutter/pubspec.yaml
          pushd flutter
          flutter pub get
          flutter test --no-pub test/ongrow_device_attestation_test.dart
          flutter test --no-pub test/ongrow_device_enrollment_test.dart
          flutter test --no-pub test/ongrow_support_view_test.dart
          flutter analyze --no-pub \
            lib/common/ongrow_device_attestation.dart \
            lib/common/ongrow_device_enrollment.dart \
            packages/ongrow_support_ui/lib/ongrow_support_view.dart \
            test/ongrow_device_attestation_test.dart \
            test/ongrow_device_enrollment_test.dart \
            test/ongrow_support_view_test.dart
          popd

      - name: Generate Flutter Rust Bridge files
        shell: bash
        run: |
          ~/.cargo/bin/flutter_rust_bridge_codegen \
            --rust-input ./src/flutter_ffi.rs \
            --dart-output ./flutter/lib/generated_bridge.dart \
            --c-output ./flutter/macos/Runner/bridge_generated.h
          cp ./flutter/macos/Runner/bridge_generated.h \
            ./flutter/ios/Runner/bridge_generated.h

      - name: Verify generated bridge files
        shell: bash
        run: |
          test -s ./src/bridge_generated.rs
          test -s ./src/bridge_generated.io.rs
          test -s ./flutter/lib/generated_bridge.dart
          test -s ./flutter/lib/generated_bridge.freezed.dart
          test -s ./flutter/macos/Runner/bridge_generated.h

      - name: Upload bridge artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ongrow-bridge-1.4.9
          retention-days: 1
          if-no-files-found: error
          path: |
            ./src/bridge_generated.rs
            ./src/bridge_generated.io.rs
            ./flutter/lib/generated_bridge.dart
            ./flutter/lib/generated_bridge.freezed.dart
            ./flutter/macos/Runner/bridge_generated.h

  build-macos-arm64:
    needs: generate-bridge
    runs-on: macos-14
    timeout-minutes: 180
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          submodules: recursive
          persist-credentials: false

      - name: Validate and apply OnGROW product profile
        shell: bash
        run: |
          test -n "$ONGROW_RENDEZVOUS_HOST"
          test -n "$ONGROW_HBBS_PUBLIC_KEY"
          test -n "$ONGROW_CONTROL_PLANE_URL"
          python3 scripts/test_ongrow_product_profile.py
          git -C libs/hbb_common apply --unidiff-zero \
            "$GITHUB_WORKSPACE/.github/patches/ongrow-support-desk-hbb-common.patch"
          python3 scripts/apply_ongrow_product_profile.py \
            --role customer-desk \
            --app-name "OnGROW Support Desk" \
            --rendezvous-host "$ONGROW_RENDEZVOUS_HOST" \
            --hbbs-public-key "$ONGROW_HBBS_PUBLIC_KEY" \
            --control-plane-url "$ONGROW_CONTROL_PLANE_URL"
          test "$(git -C libs/hbb_common diff --name-only)" = "src/config.rs"

      - name: Record build provenance
        shell: bash
        run: |
          python3 - <<'PY' > ongrow-build-provenance.txt
          import base64
          import hashlib
          import os
          import subprocess

          def git(*args: str) -> str:
              return subprocess.check_output(["git", *args], text=True).strip()

          key = base64.b64decode(os.environ["ONGROW_HBBS_PUBLIC_KEY"], validate=True)
          print(f"source={git('rev-parse', 'HEAD')}")
          print(f"submodules={git('submodule', 'status', '--recursive').replace(chr(10), ';')}")
          patch = open(".github/patches/ongrow-support-desk-hbb-common.patch", "rb").read()
          print(f"profile_patch_sha256={hashlib.sha256(patch).hexdigest()}")
          print(f"hbbs_key_sha256={hashlib.sha256(key).hexdigest()}")
          PY

      - name: Verify source revision and runner architecture
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(uname -m)" = "arm64"
          test "$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)" = "$VERSION"

      - name: Install build runtime
        run: |
          brew install llvm create-dmg
          if ! command -v pkg-config >/dev/null 2>&1; then
            brew install pkg-config
          fi

      - name: Install NASM
        shell: bash
        run: |
          curl -fsSLO \
            https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/macosx/nasm-2.16.03-macosx.zip
          echo "0d29bcd8a5fc617333f4549c7c1f93d1866a4a0915c40359e0a8585bb1a5aa75  nasm-2.16.03-macosx.zip" \
            | shasum -a 256 -c -
          unzip nasm-2.16.03-macosx.zip
          sudo install -m 0755 nasm-2.16.03/nasm /usr/local/bin/nasm
          nasm --version

      - name: Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Patch Flutter
        shell: bash
        run: |
          cd "$(dirname "$(dirname "$(which flutter)")")"
          git apply \
            "$GITHUB_WORKSPACE/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff"

      - name: Apply Flutter scheduler workaround
        shell: bash
        run: |
          cd "$(dirname "$(which flutter)")"
          sed -i -e \
            's/_setFramesEnabledState(false);/\/\/_setFramesEnabledState(false);/g' \
            ../packages/flutter/lib/src/scheduler/binding.dart
          grep -n '_setFramesEnabledState(false);' \
            ../packages/flutter/lib/src/scheduler/binding.dart

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.MAC_RUST_VERSION }}
          targets: aarch64-apple-darwin
          components: rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: macos-14

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ongrow-bridge-1.4.9
          path: ./

      - name: Setup vcpkg with GitHub Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        shell: bash
        run: |
          if ! "$VCPKG_ROOT/vcpkg" \
            install \
            --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r log_file; do
              echo "$log_file:"
              echo "======"
              cat "$log_file"
              echo "======"
              echo ""
            done
            exit 1
          fi
          head -n 100 \
            "${VCPKG_ROOT}/buildtrees/ffmpeg/build-arm64-osx-rel-out.log" || true

      - name: Run OnGROW device attestation tests
        run: |
          cargo test --locked --lib --features flutter \
            ui_interface::tests
          cargo test --locked --lib --features flutter \
            ongrow_control

      - name: Build RustDesk
        shell: bash
        run: |
          MIN_MACOS_VERSION="12.3"
          sed -i -e \
            "s/MACOSX_DEPLOYMENT_TARGET\=[0-9]*.[0-9]*/MACOSX_DEPLOYMENT_TARGET=${MIN_MACOS_VERSION}/" \
            build.py
          sed -i -e \
            "s/platform :osx, '.*'/platform :osx, '${MIN_MACOS_VERSION}'/" \
            flutter/macos/Podfile
          sed -i -e \
            "s/osx_minimum_system_version = \"[0-9]*.[0-9]*\"/osx_minimum_system_version = \"${MIN_MACOS_VERSION}\"/" \
            Cargo.toml
          sed -i -e \
            "s/MACOSX_DEPLOYMENT_TARGET = [0-9]*.[0-9]*;/MACOSX_DEPLOYMENT_TARGET = ${MIN_MACOS_VERSION};/" \
            flutter/macos/Runner.xcodeproj/project.pbxproj
          ./build.py --flutter --hwcodec --unix-file-copy-paste --screencapturekit

      - name: Verify app bundle and architecture
        shell: bash
        run: |
          RUSTDESK_APP_PATH="flutter/build/macos/Build/Products/Release/OnGROW Support Desk.app"
          test -d "$RUSTDESK_APP_PATH"
          test "$(
            /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' \
              "$RUSTDESK_APP_PATH/Contents/Info.plist"
          )" = "de.ongrow.supportdesk"
          test "$(
            /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' \
              "$RUSTDESK_APP_PATH/Contents/Info.plist"
          )" = "OnGROW Support Desk"
          test "$(
            /usr/libexec/PlistBuddy -c 'Print :CFBundleURLTypes:0:CFBundleURLSchemes:0' \
              "$RUSTDESK_APP_PATH/Contents/Info.plist"
          )" = "ongrow-support"
          RUSTDESK_EXECUTABLE="$(
            /usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' \
              "$RUSTDESK_APP_PATH/Contents/Info.plist"
          )"
          test "$RUSTDESK_EXECUTABLE" = "OnGROW Support Desk"
          test -x "$RUSTDESK_APP_PATH/Contents/MacOS/$RUSTDESK_EXECUTABLE"
          test -s "$RUSTDESK_APP_PATH/Contents/Resources/AppIcon.icns"
          file "$RUSTDESK_APP_PATH/Contents/MacOS/$RUSTDESK_EXECUTABLE" \
            | grep -q "arm64"

      - name: Verify embedded OnGROW trust profile
        shell: bash
        run: |
          RUSTDESK_APP_PATH="flutter/build/macos/Build/Products/Release/OnGROW Support Desk.app"
          RUSTDESK_RUST_CORE="$RUSTDESK_APP_PATH/Contents/Frameworks/liblibrustdesk.dylib"
          test -s "$RUSTDESK_RUST_CORE"
          file "$RUSTDESK_RUST_CORE" | grep -q "Mach-O.*arm64"
          python3 - "$RUSTDESK_RUST_CORE" <<'PY'
          import base64
          import hashlib
          import os
          import pathlib
          import sys

          binary = pathlib.Path(sys.argv[1]).read_bytes()
          host = os.environ["ONGROW_RENDEZVOUS_HOST"].encode()
          encoded_key = os.environ["ONGROW_HBBS_PUBLIC_KEY"].encode()
          if host not in binary:
              raise SystemExit("OnGROW rendezvous host is missing from artifact")
          if encoded_key not in binary:
              raise SystemExit("OnGROW hbbs trust anchor is missing from artifact")
          key = base64.b64decode(encoded_key, validate=True)
          print(f"verified hbbs key sha256={hashlib.sha256(key).hexdigest()}")
          PY

      - name: Ad-hoc sign and verify app bundle
        shell: bash
        run: |
          RUSTDESK_APP_PATH="flutter/build/macos/Build/Products/Release/OnGROW Support Desk.app"
          RUSTDESK_SERVICE_PATH="$RUSTDESK_APP_PATH/Contents/MacOS/service"
          test -x "$RUSTDESK_SERVICE_PATH"
          codesign \
            --force \
            --sign - \
            --timestamp=none \
            "$RUSTDESK_SERVICE_PATH"
          codesign \
            --force \
            --sign - \
            --timestamp=none \
            --entitlements flutter/macos/Runner/Release.entitlements \
            "$RUSTDESK_APP_PATH"
          codesign --verify --deep --strict --verbose=4 "$RUSTDESK_APP_PATH"

      - name: Smoke test app launch
        shell: bash
        run: |
          RUSTDESK_APP_PATH="flutter/build/macos/Build/Products/Release/OnGROW Support Desk.app"
          RUSTDESK_SMOKE_LOG="$RUNNER_TEMP/ongrow-support-desk-smoke.log"
          RUSTDESK_EXECUTABLE="$(
            /usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' \
              "$RUSTDESK_APP_PATH/Contents/Info.plist"
          )"
          RUST_BACKTRACE=1 NSUnbufferedIO=YES \
            "$RUSTDESK_APP_PATH/Contents/MacOS/$RUSTDESK_EXECUTABLE" \
            >"$RUSTDESK_SMOKE_LOG" 2>&1 &
          RUSTDESK_PID=$!
          cleanup() {
            kill "$RUSTDESK_PID" 2>/dev/null || true
            wait "$RUSTDESK_PID" 2>/dev/null || true
          }
          trap cleanup EXIT
          sleep 5
          if ! kill -0 "$RUSTDESK_PID" 2>/dev/null; then
            if wait "$RUSTDESK_PID"; then
              RUSTDESK_EXIT=0
            else
              RUSTDESK_EXIT=$?
            fi
            echo "RustDesk exited during launch smoke test: $RUSTDESK_EXIT"
            sed -n '1,240p' "$RUSTDESK_SMOKE_LOG"
            find "$HOME/Library/Logs/DiagnosticReports" \
              -type f -mmin -5 -print \
              -exec tail -n 160 {} \; 2>/dev/null || true
            exit 1
          fi

      - name: Create and verify unsigned DMG
        shell: bash
        run: |
          RUSTDESK_DMG="ongrow-support-desk-${VERSION}-macos-arm64-adhoc.dmg"
          rm -f "$RUSTDESK_DMG"
          create-dmg \
            --volname "OnGROW Support Desk" \
            --icon "OnGROW Support Desk.app" 200 190 \
            --hide-extension "OnGROW Support Desk.app" \
            --window-size 800 400 \
            --app-drop-link 600 185 \
            "$RUSTDESK_DMG" \
            "./flutter/build/macos/Build/Products/Release/OnGROW Support Desk.app"
          hdiutil verify "$RUSTDESK_DMG"
          shasum -a 256 "$RUSTDESK_DMG" > "${RUSTDESK_DMG}.sha256"

      - name: Upload ad-hoc signed macOS artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ongrow-support-desk-1.4.9-macos-arm64
          retention-days: 7
          if-no-files-found: error
          path: |
            ongrow-support-desk-1.4.9-macos-arm64-adhoc.dmg
            ongrow-support-desk-1.4.9-macos-arm64-adhoc.dmg.sha256
            ongrow-build-provenance.txt
