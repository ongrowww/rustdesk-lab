name: OnGROW macOS isolated Sparkle update drill

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'flutter/macos/Runner/OnGrowUpdat*.swift'
      - 'flutter/macos/Runner/AppDelegate.swift'
      - 'flutter/macos/Runner/Info.plist'
      - 'flutter/macos/Runner.xcodeproj/**'
      - 'scripts/*ongrow*macos*update*'
      - 'scripts/test_ongrow_sparkle_probe.py'
      - 'scripts/fixtures/ongrow_sparkle_probe/**'
      - '.github/workflows/ongrow-autoupdate-macos-lab.yml'

permissions:
  contents: read

jobs:
  isolated-update:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Validate update policy and source fixtures
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          python3 scripts/test_ongrow_macos_update_profile.py
          python3 scripts/test_ongrow_sparkle_probe.py
          xcrun swiftc flutter/macos/Runner/OnGrowUpdatePolicy.swift scripts/test_ongrow_macos_update_policy.swift -o "$RUNNER_TEMP/policy-test"
          "$RUNNER_TEMP/policy-test"
          plutil -lint flutter/macos/Runner.xcodeproj/project.pbxproj
      - name: Fetch exact Sparkle release and verify both checksums
        run: |
          mkdir "$RUNNER_TEMP/sparkle-tools"
          curl --fail --location --proto '=https' --proto-redir '=https' --tlsv1.2 https://github.com/sparkle-project/Sparkle/releases/download/2.10.0/Sparkle-2.10.0.tar.xz -o "$RUNNER_TEMP/sparkle.tar.xz"
          echo "c2bf58aa8387266ac179357b1415d6f2635f044da8be41042af32425dae6da0c  $RUNNER_TEMP/sparkle.tar.xz" | shasum -a 256 -c -
          curl --fail --location --proto '=https' --proto-redir '=https' --tlsv1.2 https://github.com/sparkle-project/Sparkle/releases/download/2.10.0/Sparkle-for-Swift-Package-Manager.zip -o "$RUNNER_TEMP/sparkle-spm.zip"
          echo "17e28312b8e18ab7cdbbe09a6fb28cc55a5479ec6c371dbc07cdecd2a14fd959  $RUNNER_TEMP/sparkle-spm.zip" | shasum -a 256 -c -
          tar -xJf "$RUNNER_TEMP/sparkle.tar.xz" -C "$RUNNER_TEMP/sparkle-tools"
      - name: Real signed download, replacement and rejection cases
        run: python3 scripts/test_ongrow_sparkle_probe.py --integration "$RUNNER_TEMP/sparkle-tools"
